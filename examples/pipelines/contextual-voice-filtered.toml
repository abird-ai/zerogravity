# Zerogravity v1 structural example (NOT runnable yet).
# One Rust process can share 'assistant' across this live voice pipeline and
# the ordinary text pipeline below; no per-stage llama.cpp/ollama servers.
schema = "zerogravity.pipeline.v1"

[[model]]
id = "recognizer"
target = "nvidia-canary-qwen-2.5b"
# source = "/absolute/path/to/verified/cache/snapshot"

[[model]]
id = "speakers"
target = "speaker-diarization"
# A chosen original speaker model and exact source are not qualified yet.

[[model]]
id = "assistant"
target = "qwen3.5-2b"

[[model]]
id = "voice"
target = "qwen3-tts-1.7b"

# An optional typed classifier instance. No specific NanoJev release
# is assumed and model execution is NOT IMPLEMENTED.
[[model]]
id = "gate"
target = "nanojev-decision"

[[pipeline]]
name = "talk"
input = "audio-pcm"
output = "audio-pcm"
realtime = true
# Explicit opt-in: only previously committed, same-session user-visible
# conversation text enters the ASR, diarization and translation hints.
# Set enabled=false to retain the same graph with no hints at all.
# Explicit source requests, not permission grants. Defaults are only
# session/user_message and session/assistant_message when this is omitted.
# The application's own system/developer prompts and user-authorized
# shared-group records can also be requested when permitted by the owner.
[pipeline.chat_context]
enabled = true
from_model = "assistant"
max_bytes = 4096
sources = [
  "session/user_message",
  "session/assistant_message",
  "session/tool_call",
  "session/tool_result",
  "application/system_prompt",
  "application/developer_prompt",
  "shared:team-support/assistant_message",
]

# Independent decisions about tool calls and tool results.
[[pipeline.chat_context.filter]]
kind = "match"
action = "exclude"
field = "kind"
values = ["tool_call"]

[[pipeline.chat_context.filter]]
kind = "match"
action = "exclude"
field = "kind"
values = ["tool_result"]

# Independent calibrated include/omit decision after deterministic filtering.
# Only records already selected and authorized can reach the model.
# Actual NanoJev inference remains NOT IMPLEMENTED.
[[pipeline.chat_context.filter]]
kind = "decision"
model = "gate"
question = "Does this context entry help understand the current audio?"
min_confidence_bps = 7500
on_unavailable = "omit"

[[pipeline.step]]
id = "listen"
kind = "asr"
model = "recognizer"

[[pipeline.step]]
id = "speaker"
kind = "diarization"
model = "speakers"

# Typed translation retains timestamped speaker identity; it never overwrites
# the original acoustic transcript. LLM-specific translation is NOT IMPLEMENTED.
[[pipeline.step]]
id = "translate"
kind = "translate"
model = "assistant"

[[pipeline.step]]
id = "prompt"
kind = "speakers-text"

[[pipeline.step]]
id = "reply"
kind = "llm"
model = "assistant"

[[pipeline.step]]
id = "speak"
kind = "tts"
model = "voice"

[[pipeline.link]]
from = "input.value"
to = "listen.audio"

[[pipeline.link]]
from = "input.value"
to = "speaker.audio"

[[pipeline.link]]
from = "listen.transcript"
to = "speaker.transcript"

[[pipeline.link]]
from = "speaker.speakers"
to = "translate.speakers"

[[pipeline.link]]
from = "translate.speakers"
to = "prompt.speakers"

[[pipeline.link]]
from = "prompt.text"
to = "reply.text"

[[pipeline.link]]
from = "reply.text"
to = "speak.text"

# Read-only hint edges. The special "context" node is a *previous turn*
# session snapshot, not a second LLM inference pass or a cycle to the
# current reply. If disabled, all four optional inputs receive None.
[[pipeline.link]]
from = "context.value"
to = "listen.context"

[[pipeline.link]]
from = "context.value"
to = "speaker.context"

[[pipeline.link]]
from = "context.value"
to = "translate.context"

[[pipeline.link]]
from = "context.value"
to = "prompt.context"

[[pipeline.link]]
from = "speak.audio"
to = "output.value"

# The same model instance 'assistant' serves a second pipeline in the same
# physical ResourceArbiter/device pools. Connections do not copy tensors unless
# a registered codec/placement conversion needs them.
[[pipeline]]
name = "chat"
input = "text"
output = "text"

[[pipeline.step]]
id = "reply"
kind = "llm"
model = "assistant"

[[pipeline.link]]
from = "input.value"
to = "reply.text"

[[pipeline.link]]
from = "reply.text"
to = "output.value"

# Routes are declarations. No HTTP/SSE/WebRTC/WS listener exists yet.
[[route]]
path = "/v1/realtime"
pipeline = "talk"
protocol = "websocket"

[[route]]
path = "/v1/chat/completions"
pipeline = "chat"
protocol = "openai-text"
