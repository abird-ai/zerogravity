[workspace]
members = [
    "crates/zerogravity-core",
    "crates/zerogravity-artifacts",
    "crates/zerogravity-cpu",
    "crates/zerogravity-model-qwen35",
    "crates/zerogravity-model-gemma4",
    "crates/zerogravity-gpu",
]
exclude = [
    "crates/zerogravity-gpu/vendor/cubecl-ir",
    "crates/zerogravity-gpu/vendor/cubecl-cpp",
    "crates/zerogravity-gpu/vendor/cubecl-cuda",
    "crates/zerogravity-gpu/vendor/cubecl-hip",
]
resolver = "3"

[workspace.package]
version = "0.1.0"

[patch.crates-io]
cubecl-ir = { path = "crates/zerogravity-gpu/vendor/cubecl-ir" }
cubecl-cpp = { path = "crates/zerogravity-gpu/vendor/cubecl-cpp" }
cubecl-cuda = { path = "crates/zerogravity-gpu/vendor/cubecl-cuda" }
cubecl-hip = { path = "crates/zerogravity-gpu/vendor/cubecl-hip" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
