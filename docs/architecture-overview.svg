<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="932" viewBox="0 0 1040 932" role="img" aria-labelledby="title desc">
  <title id="title">ZeroGravity live programmable inference stack</title>
  <desc id="desc">CLI, TUI, Web, Rust SDK and MCP clients use one reusable Service and native API. Typed task and model semantics are prepared into kernel chains, fused regions, libraries, captures and optional compiled regions. The shared execution fabric owns scheduling, session state, resource admission and physical completion for CPU, ROCm HIP, CUDA and Vulkan. Observations feed revision decisions; the Service records and reuses saved revisions and studies.</desc>
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        font-size: 17px;
        fill: #e8e8e8;
      }
      .title { font-size: 25px; font-weight: 700; }
      .heading { font-size: 20px; font-weight: 700; }
      .client-label { font-size: 18px; font-weight: 600; }
      .small { font-size: 15px; }
      .muted { fill: #bebebe; }
      .canvas { fill: #101010; stroke: #333; }
      .panel { fill: #161616; stroke: #414141; }
      .client { fill: #1c1c1c; stroke: #444; }
      .device { fill: #2a2a2a; stroke: #505050; }
      .arrow { fill: none; stroke: #b6b6b6; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .feedback { fill: none; stroke: #929a9f; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 5 5; }
      .record { fill: none; stroke: #858585; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#b6b6b6" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect class="canvas" x="12" y="12" width="1016" height="908" rx="20"/>
  <text class="title" x="40" y="53">ZeroGravity</text>
  <text class="muted" x="1000" y="51" text-anchor="end">One native service · one execution fabric</text>

  <g text-anchor="middle">
    <rect class="client" x="40" y="88" width="184" height="50" rx="9"/>
    <rect class="client" x="234" y="88" width="184" height="50" rx="9"/>
    <rect class="client" x="428" y="88" width="184" height="50" rx="9"/>
    <rect class="client" x="622" y="88" width="184" height="50" rx="9"/>
    <rect class="client" x="816" y="88" width="184" height="50" rx="9"/>
    <text class="client-label" x="132" y="120">CLI</text>
    <text class="client-label" x="326" y="120">TUI</text>
    <text class="client-label" x="520" y="120">Web</text>
    <text class="client-label" x="714" y="120">Rust SDK</text>
    <text class="client-label" x="908" y="120">MCP</text>
  </g>
  <path class="arrow" d="M132 138 V162 H908 V138 M326 138 V162 M520 138 V162 M714 138 V162"/>
  <path class="arrow" d="M520 162 V188" marker-end="url(#arrowhead)"/>

  <rect class="panel" x="40" y="188" width="960" height="100" rx="12"/>
  <g text-anchor="middle">
    <text class="heading" x="520" y="222">Reusable Service · native API</text>
    <text x="520" y="251">Catalog · operations · immutable revisions · activation</text>
    <text class="small muted" x="520" y="274">Embedded and attached clients share the same typed contracts</text>
  </g>

  <path class="arrow" d="M384 288 V324" marker-end="url(#arrowhead)"/>
  <rect class="panel" x="40" y="324" width="688" height="114" rx="12"/>
  <g text-anchor="middle">
    <text class="heading" x="384" y="357">Typed task and model semantics</text>
    <text x="384" y="387">Task ports · ModelProgram · ForwardPlan</text>
    <text class="muted" x="384" y="415">Source bindings · numerical rules · state effects</text>
  </g>

  <path class="arrow" d="M384 438 V474" marker-end="url(#arrowhead)"/>
  <rect class="panel" x="40" y="474" width="688" height="142" rx="12"/>
  <g text-anchor="middle">
    <text class="heading" x="384" y="508">Prepared execution mapping</text>
    <text x="384" y="539">Kernel chains · multi-operation fusion · native libraries</text>
    <text x="384" y="567">Layouts · transfers · capture · optional compiled regions</text>
    <text class="small muted" x="384" y="596">Exact source, ABI, shape and live-owner bindings</text>
  </g>

  <path class="arrow" d="M384 616 V652" marker-end="url(#arrowhead)"/>
  <rect class="panel" x="40" y="652" width="688" height="114" rx="12"/>
  <g text-anchor="middle">
    <text class="heading" x="384" y="685">Shared execution fabric</text>
    <text x="384" y="715">Scheduler · session state · resource admission</text>
    <text class="muted" x="384" y="743">Resource ownership · physical completion · quarantine</text>
  </g>

  <rect class="panel" x="764" y="324" width="236" height="142" rx="12"/>
  <g text-anchor="middle">
    <text class="heading" x="882" y="357">Observations</text>
    <text x="882" y="388">Counters · profiles · traces</text>
    <text class="small muted" x="882" y="416">Clocks · provenance · gaps</text>
    <text class="small muted" x="882" y="444">Bounded optional capture</text>
  </g>
  <path class="feedback" d="M728 708 H746 V395 H764" marker-end="url(#arrowhead)"/>
  <path class="feedback" d="M882 324 V288" marker-end="url(#arrowhead)"/>

  <rect class="panel" x="764" y="502" width="236" height="142" rx="12"/>
  <g text-anchor="middle">
    <text class="heading" x="882" y="535">Saved work</text>
    <text x="882" y="565">Revision recipes</text>
    <text x="882" y="593">Studies · artifacts · results</text>
    <text class="small muted" x="882" y="622">Preparation · activation lineage</text>
  </g>
  <path class="record" d="M970 288 V306 H1012 V573 H1000" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
  <g text-anchor="middle">
    <text class="small muted" x="882" y="686">Observations inform revisions</text>
    <text class="small muted" x="882" y="712">Recipes prepare fresh owners</text>
  </g>

  <path class="arrow" d="M384 766 V790 M155 790 H885"/>
  <path class="arrow" d="M155 790 V812" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M398 790 V812" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M642 790 V812" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M885 790 V812" marker-end="url(#arrowhead)"/>
  <g text-anchor="middle">
    <rect class="device" x="40" y="812" width="230" height="70" rx="10"/>
    <rect class="device" x="283" y="812" width="230" height="70" rx="10"/>
    <rect class="device" x="527" y="812" width="230" height="70" rx="10"/>
    <rect class="device" x="770" y="812" width="230" height="70" rx="10"/>
    <text class="heading" x="155" y="842">CPU</text>
    <text class="heading" x="398" y="842">ROCm (HIP)</text>
    <text class="heading" x="642" y="842">CUDA</text>
    <text class="heading" x="885" y="842">Vulkan</text>
    <text class="small muted" x="155" y="867">Device backend</text>
    <text class="small muted" x="398" y="867">Device backend</text>
    <text class="small muted" x="642" y="867">Device backend</text>
    <text class="small muted" x="885" y="867">Device backend</text>
  </g>
</svg>
