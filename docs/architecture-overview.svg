<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="900" viewBox="0 0 1040 900" role="img" aria-labelledby="title desc">
  <title id="title">ZeroGravity execution architecture</title>
  <desc id="desc">One execution fabric owns serving, scheduling, batching, memory and state. Model semantics and execution planning choose native execution or optional compiled regions. Both use the appropriate device backend and physical hardware.</desc>
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        font-size: 18px;
        fill: #e8e8e8;
      }
      .heading { font-size: 21px; font-weight: 700; }
      .muted { fill: #c5c5c5; }
      .panel { fill: #101010; stroke: #333; }
      .device { fill: #2e2e2e; stroke: #4a4a4a; }
      .divider { stroke: #333; }
      .arrow { fill: none; stroke: #bdbdbd; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <path id="down" class="arrow" d="M0 -6 V4 M-4 0 L0 4 L4 0"/>
  </defs>
  <rect x="12" y="12" width="1016" height="876" rx="20" class="panel"/>
  <g text-anchor="middle">
    <text class="heading" x="520" y="64">ZeroGravity execution fabric</text>
    <text class="muted" x="520" y="94">Serving · scheduling · batching · pipelines</text>
    <text class="muted" x="520" y="122">Memory · state · lifecycle · distributed execution</text>
    <use href="#down" x="520" y="157"/>

    <rect class="panel" x="28" y="184" width="984" height="92" rx="14"/>
    <text class="heading" x="520" y="222">Model semantics and execution planning</text>
    <text class="muted" x="520" y="252">ModelProgram · ForwardPlan · closed computation regions</text>
    <use href="#down" x="520" y="293"/>
  </g>

  <g>
    <rect class="panel" x="28" y="320" width="486" height="302" rx="10"/>
    <rect class="panel" x="526" y="320" width="486" height="302" rx="10"/>
    <text class="heading" x="44" y="359">Native execution</text>
    <text class="muted" x="44" y="393">Shared mathematical primitives</text>
    <path class="divider" d="M44 420 H498"/>
    <text x="44" y="458">rocBLAS / hipBLASLt / cuBLASLt</text>
    <text x="44" y="492">FlashAttention / FlashInfer</text>
    <text x="44" y="526">MIOpen / cuDNN</text>
    <text x="44" y="560">CubeCL / custom kernels</text>
    <text x="44" y="594">Captured command graphs</text>

    <text class="heading" x="542" y="359">Compiled execution</text>
    <text class="muted" x="542" y="393">Whole models or closed regions</text>
    <path class="divider" d="M542 420 H996"/>
    <text x="542" y="458">MIGraphX</text>
    <text x="542" y="492">TensorRT</text>
    <text x="542" y="526">IREE</text>
    <text x="542" y="560">ONNX Runtime</text>
    <text x="542" y="594">Graph-only accelerators</text>
  </g>

  <g text-anchor="middle">
    <use href="#down" x="520" y="639"/>
    <rect class="device" x="28" y="666" width="241.5" height="82" rx="10"/>
    <rect class="device" x="275.5" y="666" width="241.5" height="82" rx="10"/>
    <rect class="device" x="523" y="666" width="241.5" height="82" rx="10"/>
    <rect class="device" x="770.5" y="666" width="241.5" height="82" rx="10"/>
    <text class="heading" x="148.75" y="700">CPU</text>
    <text class="muted" x="148.75" y="730">Device backend</text>
    <text class="heading" x="396.25" y="700">CUDA</text>
    <text class="muted" x="396.25" y="730">Device backend</text>
    <text class="heading" x="643.75" y="700">HIP</text>
    <text class="muted" x="643.75" y="730">Device backend</text>
    <text class="heading" x="891.25" y="700">Vulkan</text>
    <text class="muted" x="891.25" y="730">Device backend</text>
    <use href="#down" x="520" y="765"/>

    <text class="heading" x="520" y="826">Physical hardware</text>
    <text class="muted" x="520" y="856">CPU · GPU · NPU · specialized accelerators</text>
  </g>
</svg>
