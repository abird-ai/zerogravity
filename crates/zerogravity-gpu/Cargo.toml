[package]
name = "zerogravity-gpu"
version.workspace = true
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
description = "Source-exact resident GPU execution and physical ownership"

[features]
default = []
vulkan = ["cubecl/vulkan"]
cuda = ["cubecl/cuda", "cubecl/cuda-cpp"]
hip = ["cubecl/hip", "cubecl/hip-cpp", "dep:cubecl-hip"]
all = ["vulkan", "cuda", "hip"]
qualification = ["zerogravity-artifacts/cache", "zerogravity-cpu/cache", "dep:zerogravity-cpu"]
hardware-abort-probe = ["qualification", "cubecl-hip?/source-page-event-probe"]
source-page-event-probe = ["hip", "hardware-abort-probe"]
gemma-bf16-qualification = ["qualification", "dep:sha2"]
qwen-source-qualification = ["qualification", "hip", "dep:sha2", "dep:cubecl-hip"]
portable-checkpoint = ["zerogravity-core/diagnostic-cpu-checkpoint"]
# Production CUDA transport/compiler ownership only; no captured cases or
# qualification API surface.
cuda-native = ["cuda", "zerogravity-artifacts/cache", "dep:cubecl-cuda", "cubecl-cuda/owned-cubin", "cubecl-cuda/precompiled-shared"]
# Historical finite native orchestration is diagnostic-only.
cuda-native-qualification = ["cuda-native", "qualification"]
cuda-cublas = ["cuda-native-qualification", "cubecl-cuda/owned-cublas-allocator"]

[dependencies]
zerogravity-core = { path = "../zerogravity-core" }
zerogravity-artifacts = { path = "../zerogravity-artifacts" }
zerogravity-cpu = { path = "../zerogravity-cpu", optional = true }
cubecl = { version = "=0.11.0", default-features = false, features = ["std", "stdlib"] }
cubecl-common = "=0.11.0"
cubecl-core = "=0.11.0"
cubecl-runtime = "=0.11.0"
cubecl-server = "=0.11.0"
cubecl-cuda = { version = "=0.11.0", default-features = false, optional = true }
cubecl-hip = { version = "=0.11.0", default-features = false, optional = true }
futures-lite = "=2.6.1"
async-lock = "=3.4.2"

sha2 = { version = "=0.10.9", optional = true }

[dev-dependencies]
sha2 = "=0.10.9"
# Source fixtures only; qualification drivers own runtime model composition.
zerogravity-model-qwen35 = { path = "../zerogravity-model-qwen35", default-features = false, features = ["cpu", "text", "source-binding", "diagnostic-cpu-checkpoint"] }
