[package]
name = "zerogravity-model-gemma4"
version.workspace = true
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"

[features]
default = []
text-reference = ["dep:zerogravity-cpu", "dep:zerogravity-artifacts", "dep:sha2", "zerogravity-cpu/cache", "zerogravity-artifacts/cache"]
text-tokenizer = ["text-reference", "dep:tokenizers", "dep:serde"]

execution = ["text-tokenizer"]
hip-qualification = ["execution", "dep:zerogravity-gpu", "zerogravity-gpu/hip", "zerogravity-gpu/gemma-bf16-qualification"]
vulkan-qualification = ["execution", "dep:zerogravity-gpu", "zerogravity-gpu/vulkan", "zerogravity-gpu/gemma-bf16-qualification"]
shared-hip-qualification = ["hip-qualification", "zerogravity-gpu/qwen-source-qualification"]

[dependencies]
zerogravity-core = { path = "../zerogravity-core" }
zerogravity-gpu = { path = "../zerogravity-gpu", optional = true, default-features = false }
serde_json = "=1.0.151"
zerogravity-cpu = { path = "../zerogravity-cpu", optional = true }
zerogravity-artifacts = { path = "../zerogravity-artifacts", optional = true }
sha2 = { version = "=0.10.9", optional = true }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"], optional = true }
serde = { version = "=1.0.229", features = ["derive"], optional = true }

[[example]]
name = "gemma4_e2b_text"
required-features = ["text-reference"]

[[example]]
name = "gemma4_tokenizer"
required-features = ["text-tokenizer"]
