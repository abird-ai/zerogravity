[package]
name = "zerogravity-cli"
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "Explicit CPU and resident GPU text frontend for Zerogravity"
publish = false
license = "MIT"
default-run = "zerogravity"

[features]
default = ["cpu", "model-qwen35", "text"]
# Opt-in native HTTP/1.1 OpenAI surface; CPU continuous interleaving
# uses the existing model and state owners.
serve = ["cpu", "model-qwen35", "text", "cache", "dep:httparse"]
cpu = ["zerogravity/cpu"]
model-qwen35 = ["zerogravity/model-qwen35"]
model-gemma4 = ["zerogravity/model-gemma4"]
text = ["model-qwen35", "zerogravity/text"]
cache = ["zerogravity/cache"]
gemma4-cpu-candidate = ["model-gemma4", "cpu", "cache", "zerogravity/model-gemma4-cpu-candidate", "dep:signal-hook"]
gemma4-hip-resident-candidate = ["gemma4-cpu-candidate", "hip", "zerogravity/gemma4-hip-qualification"]
acquisition = ["cache", "zerogravity/acquisition", "dep:signal-hook", "dep:rustix"]
diagnostic-acquisition = ["acquisition", "zerogravity/diagnostic-acquisition"]
vulkan = ["zerogravity/vulkan", "dep:futures-lite"]
cuda = ["zerogravity/cuda", "dep:futures-lite", "dep:nvml-wrapper"]
# Previous features: short-hf-run, canonical47-serving, short-hf-serving.
qwen35-cuda = ["cuda", "cache", "model-qwen35", "text", "zerogravity/qwen35-cuda"]
qwen35-cuda-serving = ["serve", "qwen35-cuda"]
hip = ["zerogravity/hip", "dep:futures-lite"]
all-models = ["model-qwen35", "model-gemma4"]
all-backends = ["cpu", "vulkan", "cuda", "hip"]
all = ["all-models", "all-backends", "text"]
diagnostic-gdn-trace = ["zerogravity/diagnostic-gdn-trace"]
diagnostic-cpu-checkpoint = ["zerogravity/diagnostic-cpu-checkpoint"]

[dependencies]
zerogravity = { path = "../zerogravity", default-features = false }
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
serde_yaml = "=0.9.34"
futures-lite = { version = "=2.6.1", optional = true }
httparse = { version = "=1.10.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper = { version = "=0.13.0", optional = true }
signal-hook = { version = "=0.3.18", default-features = false, optional = true }
rustix = { version = "=1.1.5", default-features = false, features = ["fs"], optional = true }

[[bin]]
name = "zerogravity"
path = "src/main.rs"

[dev-dependencies]
sha2 = "=0.10.9"
