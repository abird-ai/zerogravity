[package]
name = "zerogravity-cli"
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "Explicit CPU and resident GPU text frontend for Zerogravity"
publish = false
license = "MIT"
default-run = "zerogravity"

[features]
default = ["cpu", "model-qwen35", "text"]
# Protocol/frontend capability only. Models and execution backends are selected
# independently and contribute the routes this server can actually load.
serve = ["zerogravity/serve", "dep:signal-hook"]
cpu = ["zerogravity/cpu"]
# Model contribution: task/cache/source support is additive, while device
# implementations still require an independently selected backend feature.
model-qwen35 = ["zerogravity/model-qwen35", "text", "cache"]
model-gemma4 = ["zerogravity/model-gemma4"]
text = ["zerogravity/text"]
cache = ["zerogravity/cache"]
gemma4-cpu-candidate = ["model-gemma4", "cpu", "cache", "zerogravity/model-gemma4-cpu-candidate", "dep:signal-hook"]
gemma4-hip-resident-candidate = ["gemma4-cpu-candidate", "hip", "zerogravity/gemma4-hip-qualification"]
acquisition = ["cache", "zerogravity/acquisition", "dep:signal-hook", "dep:rustix"]
diagnostic-acquisition = ["acquisition", "zerogravity/diagnostic-acquisition"]
vulkan = ["zerogravity/vulkan"]
cuda = ["zerogravity/cuda"]
# Opt-in native FlashAttention provider; normal CUDA remains unchanged.
cuda-flash-attn = ["cuda", "zerogravity/cuda-flash-attn"]
# Previous features: short-hf-run, canonical47-serving, short-hf-serving.
# Compatibility aliases only. Normal builds select model + backend separately.
qwen35-cuda = ["cuda", "model-qwen35", "zerogravity/qwen35-cuda"]
qwen35-hip = ["hip", "model-qwen35", "zerogravity/qwen35-hip"]
# Explicit diagnostic target for finite captured Qwen CUDA execution.
qwen35-cuda-qualification = ["qwen35-cuda", "zerogravity/qwen35-cuda-qualification"]
qwen35-cuda-serving = ["serve", "qwen35-cuda", "zerogravity/qwen35-cuda-serving"]
hip = ["zerogravity/hip"]
all-models = ["model-qwen35", "model-gemma4"]
all-backends = ["cpu", "vulkan", "cuda", "hip"]
# Normal production superset. Diagnostics/qualification remain explicit.
all = ["all-models", "all-backends", "acquisition", "serve"]
diagnostic-gdn-trace = ["zerogravity/diagnostic-gdn-trace"]
diagnostic-cpu-checkpoint = ["zerogravity/diagnostic-cpu-checkpoint"]

[dependencies]
zerogravity = { path = "../zerogravity", default-features = false }
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
serde_yaml = "=0.9.34"

[target.'cfg(target_os = "linux")'.dependencies]
signal-hook = { version = "=0.3.18", default-features = false, optional = true }
rustix = { version = "=1.1.5", default-features = false, features = ["fs"], optional = true }

[[bin]]
name = "zerogravity"
path = "src/main.rs"

[dev-dependencies]
sha2 = "=0.10.9"

[[test]]
name = "qwen35_cuda_dry_run"
path = "tests/qwen35_cuda_dry_run.rs"
required-features = ["qwen35-cuda-qualification"]
