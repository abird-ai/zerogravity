[package]
name = "zerogravity-cli"
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "Explicit CPU and resident GPU text frontend for Zerogravity"
publish = false
license = "MIT"
default-run = "zerogravity"

[features]
default = ["cpu", "model-qwen35", "text"]
cpu = ["zerogravity/cpu"]
model-qwen35 = ["zerogravity/model-qwen35"]
text = ["model-qwen35", "zerogravity/text"]
cache = ["zerogravity/cache"]
acquisition = ["cache", "zerogravity/acquisition", "dep:signal-hook", "dep:rustix"]
diagnostic-acquisition = ["acquisition", "zerogravity/diagnostic-acquisition"]
vulkan = ["zerogravity/vulkan", "dep:futures-lite"]
cuda = ["zerogravity/cuda", "dep:futures-lite"]
hip = ["zerogravity/hip", "dep:futures-lite"]
all-models = ["model-qwen35"]
all-backends = ["cpu", "vulkan", "cuda", "hip"]
all = ["all-models", "all-backends", "text"]
diagnostic-gdn-trace = ["zerogravity/diagnostic-gdn-trace"]
diagnostic-cpu-checkpoint = ["zerogravity/diagnostic-cpu-checkpoint"]

[dependencies]
zerogravity = { path = "../zerogravity", default-features = false }
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"
futures-lite = { version = "=2.6.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
signal-hook = { version = "=0.3.18", default-features = false, optional = true }
rustix = { version = "=1.1.5", default-features = false, features = ["fs"], optional = true }

[[bin]]
name = "zerogravity"
path = "src/main.rs"
