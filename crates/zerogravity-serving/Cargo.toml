[package]
name = "zerogravity-serving"
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "Embeddable Zerogravity protocol and server lifecycle contracts"
publish = false
license = "MIT"

[dependencies]
zerogravity-core = { path = "../zerogravity-core" }
zerogravity-engine = { path = "../zerogravity-engine" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# Transport dependencies stay in this crate. Only the HTTP/1 server and
# single-thread runtime features are selected; no general web framework.
tokio = { version = "=1.53.2", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
hyper = { version = "=1.13.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
bytes = "=1.12.1"
async-stream = "=0.3.6"
futures-core = "=0.3.34"
