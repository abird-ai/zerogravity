[package]
name = "zerogravity"
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "Rust-native composable AI execution fabric"
publish = false
license = "MIT"

# Source artifacts and third-party dependencies retain their own licenses.
[features]
default = ["cpu", "model-qwen35", "text"]
# Cold embedded server API; protocol execution migrates in Fabric F2.
serve = ["dep:zerogravity-serving"]
# Backends are system capabilities. Optional models contribute their own
# implementations only when both the model and backend are selected.
cpu = ["dep:zerogravity-cpu", "zerogravity-model-qwen35?/cpu"]
model-qwen35 = ["dep:zerogravity-model-qwen35", "text", "cache"]
# Source contracts only; selecting this feature does not enable Gemma inference.
model-gemma4 = ["dep:zerogravity-model-gemma4"]
# Analytic source/text reference; no tokenizer, trained model or native permit.
model-gemma4-text-reference = ["model-gemma4", "zerogravity-model-gemma4/text-reference"]
model-gemma4-cpu-candidate = ["cpu", "cache", "model-gemma4", "zerogravity-model-gemma4/execution"]
# Explicit full-source HIP diagnostic; no default inference eligibility.
gemma4-hip-qualification = ["model-gemma4-cpu-candidate", "hip", "zerogravity-model-gemma4/hip-qualification"]
gemma4-vulkan-qualification = ["model-gemma4-cpu-candidate", "vulkan", "zerogravity-model-gemma4/vulkan-qualification"]
gemma4-vulkan-peer-qualification = ["gemma4-vulkan-qualification", "hip", "zerogravity-gpu/hardware-abort-probe"]
qwen27b-hip-qualification = ["cpu", "cache", "model-qwen35", "hip", "zerogravity-model-qwen35/source-binding", "zerogravity-gpu/qwen-source-qualification"]
shared-hip-qualification = ["gemma4-hip-qualification", "qwen27b-hip-qualification", "zerogravity-model-gemma4/shared-hip-qualification"]
# Task support is weakly contributed by whichever optional models are present.
# Selecting text alone does not pull a model into the build.
text = ["zerogravity-model-qwen35?/text"]
cache = ["zerogravity-artifacts/cache", "zerogravity-cpu?/cache", "zerogravity-model-qwen35?/cache"]
acquisition = ["cache", "zerogravity-artifacts/acquisition"]
diagnostic-acquisition = ["acquisition", "zerogravity-artifacts/diagnostic-acquisition"]
vulkan = ["dep:futures-lite", "dep:zerogravity-gpu", "zerogravity-gpu/vulkan"]
# CUDA/HIP own model-neutral production primitives. Model-specific adapters are
# compiled by source cfg intersections such as model-qwen35 + cuda/hip.
cuda = [
    "dep:futures-lite",
    "dep:zerogravity-gpu",
    "zerogravity-gpu/cuda",
    "zerogravity-gpu/cuda-cublas",
    "zerogravity-model-qwen35?/cuda",
    "dep:nvml-wrapper",
    "dep:rustix",
]
# Opt-in until the external providers pass real-model correctness/performance.
cuda-flash-attn = ["cuda", "zerogravity-gpu/cuda-flash-attn"]
cuda-flashinfer = ["cuda", "zerogravity-gpu/cuda-flashinfer"]
hip = [
    "dep:futures-lite",
    "dep:zerogravity-gpu",
    "zerogravity-gpu/hip",
    "zerogravity-gpu/hip-source",
    "zerogravity-model-qwen35?/hip",
    "dep:rustix",
]
# Compatibility aliases for existing scripts/tests. New callers select the
# backend and model independently: e.g. --features cuda,model-qwen35.
qwen35-cuda = ["cuda", "model-qwen35"]
qwen35-hip = ["hip", "model-qwen35"]
qwen35-cuda-serving = ["serve", "qwen35-cuda"]
qwen35-cuda-qualification = ["qwen35-cuda", "zerogravity-gpu/qualification", "zerogravity-gpu/cuda-native-qualification"]
# P12-C cancellation probes only; no default or batched paged behavior.
qwen35-cuda-paged-cancellation-qualification = ["qwen35-cuda-qualification", "zerogravity-gpu/hardware-abort-probe"]
all-models = ["model-qwen35", "model-gemma4"]
all-backends = ["cpu", "vulkan", "cuda", "hip"]
# Normal production superset. Qualification/fault-injection features remain
# explicit and are deliberately excluded.
all = ["all-models", "all-backends", "acquisition", "serve", "state-checkpoint"]
state-checkpoint = ["zerogravity-artifacts/state-checkpoint", "zerogravity-model-qwen35?/state-checkpoint"]
diagnostic-gdn-trace = ["model-qwen35", "zerogravity-model-qwen35/diagnostic-gdn-trace"]
diagnostic-cpu-checkpoint = ["model-qwen35", "zerogravity-model-qwen35/diagnostic-cpu-checkpoint"]

[dependencies]
zerogravity-core = { path = "../zerogravity-core" }
zerogravity-engine = { path = "../zerogravity-engine" }
zerogravity-serving = { path = "../zerogravity-serving", optional = true }
zerogravity-artifacts = { path = "../zerogravity-artifacts" }
zerogravity-cpu = { path = "../zerogravity-cpu", optional = true }
zerogravity-model-qwen35 = { path = "../zerogravity-model-qwen35", default-features = false, optional = true }
zerogravity-model-gemma4 = { path = "../zerogravity-model-gemma4", default-features = false, optional = true }
zerogravity-gpu = { path = "../zerogravity-gpu", default-features = false, optional = true }
# Authenticated diagnostic reference manifests; already locked/cached.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml = "=0.9.34"
sha2 = "=0.10.9"
futures-lite = { version = "=2.6.1", optional = true }

[dev-dependencies]
# Existing runtime observer; explicit diagnostics only, never an execution route.
cubecl-runtime = { version = "=0.11.0", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper = { version = "=0.13.0", optional = true }
rustix = { version = "=1.1.5", default-features = false, features = ["fs"], optional = true }

