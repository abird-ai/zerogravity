[package]
name = "zerogravity-engine"
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "Model-neutral execution and lifecycle for Zerogravity"
publish = false
license = "MIT"

[dependencies]
zerogravity-core = { path = "../zerogravity-core" }
zerogravity-artifacts = { path = "../zerogravity-artifacts" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
