[package]
name = "zerogravity-model-qwen35"
version.workspace = true
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"

[features]
default = []
cpu = ["dep:zerogravity-cpu"]
text = ["dep:tokenizers"]
diagnostic-gdn-trace = []
# Source metadata/closed private operators; complete original forward stays refused.
original-hf-binding = ["zerogravity-artifacts/cache", "zerogravity-cpu?/cache"]
diagnostic-cpu-checkpoint = ["zerogravity-core/diagnostic-cpu-checkpoint"]

[dependencies]
zerogravity-core = { path = "../zerogravity-core", features = ["serde"] }
zerogravity-artifacts = { path = "../zerogravity-artifacts" }
zerogravity-cpu = { path = "../zerogravity-cpu", optional = true }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"], optional = true }

[dev-dependencies]
serde_json = "=1.0.151"
sha2 = "=0.10.9"
libc = "=0.2.190"

[[example]]
name = "qwen27b_output_tail"
path = "examples/qwen27b_output_tail.rs"
required-features = ["cpu", "original-hf-binding"]

[[example]]
name = "qwen27b_attention_tail"
path = "examples/qwen27b_attention_tail.rs"
required-features = ["cpu", "original-hf-binding"]

[[example]]
name = "qwen27b_full_window"
path = "examples/qwen27b_full_window.rs"
required-features = ["cpu", "original-hf-binding"]
