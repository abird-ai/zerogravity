[package]
name = "zerogravity-model-qwen35"
version.workspace = true
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"

[features]
default = []
cpu = ["dep:zerogravity-cpu"]
text = ["dep:tokenizers", "dep:sha2", "dep:regex-automata"]
diagnostic-gdn-trace = []
# Source metadata/closed private operators; complete original forward stays refused.
cache = ["zerogravity-artifacts/cache", "dep:sha2", "dep:serde"]
# Previous feature: original-hf-binding.
source-binding = ["cache", "zerogravity-cpu?/cache"]
# Backend contributions are weakly selected by the parent system backend.
# Neither feature pulls a GPU runtime into the model crate; they enable only the
# model-side source contracts needed by that backend's adapter.
cuda = ["source-binding"]
hip = ["source-binding"]
diagnostic-cpu-checkpoint = ["zerogravity-core/diagnostic-cpu-checkpoint"]

[dependencies]
zerogravity-core = { path = "../zerogravity-core", features = ["serde"] }
zerogravity-artifacts = { path = "../zerogravity-artifacts" }
zerogravity-cpu = { path = "../zerogravity-cpu", optional = true }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"], optional = true }
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"], optional = true }
sha2 = { version = "=0.10.9", optional = true }
# Same pinned release the tokenizer's pre-tokenizer already links; used only to
# read the process-global meta pool capacity for the retained-cache plan.
regex-automata = { version = "=0.4.18", default-features = false, features = [
    "std",
    "syntax",
    "meta",
    "nfa",
    "dfa",
    "hybrid",
], optional = true }

[dev-dependencies]
serde_json = "=1.0.151"
sha2 = "=0.10.9"
libc = "=0.2.190"

