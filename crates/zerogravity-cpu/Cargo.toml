[package]
name = "zerogravity-cpu"
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "Source-exact CPU operators and legacy source-weight adapter"
publish = false
license = "MIT"

[features]
cache = ["zerogravity-artifacts/cache"]

[dependencies]
zerogravity-core = { path = "../zerogravity-core" }
zerogravity-artifacts = { path = "../zerogravity-artifacts" }
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
